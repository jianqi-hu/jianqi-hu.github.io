<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="32" height="32">
  <!-- HKU Logo simplified version -->
  <defs>
    <style>
      .shield { fill: #003366; }
      .text { fill: #ffffff; font-family: serif; font-weight: bold; }
      .accent { fill: #cc0000; }
    </style>
  </defs>
  
  <!-- Shield background -->
  <path class="shield" d="M50 5 L85 25 L85 65 Q85 85 50 95 Q15 85 15 65 L15 25 Z"/>
  
  <!-- HKU text -->
  <text class="text" x="50" y="35" text-anchor="middle" font-size="12">HKU</text>
  
  <!-- Decorative elements -->
  <circle class="accent" cx="50" cy="50" r="3"/>
  <path class="text" d="M35 55 L65 55 M40 60 L60 60 M42 65 L58 65" stroke="#ffffff" stroke-width="1" fill="none"/>
  
  <!-- Bottom text -->
  <text class="text" x="50" y="78" text-anchor="middle" font-size="8">香港大學</text>
</svg>